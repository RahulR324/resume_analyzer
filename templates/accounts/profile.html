{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<section class="narrow">
  <div class="page-head" style="border-bottom: none; margin-bottom: 1rem; padding-bottom: 0;">
    <div>
      <p class="eyebrow">Account Settings</p>
      <h1>User profile</h1>
      <p class="lede">Manage your display credentials and target career orientation.</p>
    </div>
  </div>
  <form method="post" class="stack form-card">
    {% csrf_token %}
    {% for field in form %}
      <label>
        <span>{{ field.label }}</span>
        {{ field }}
        {{ field.errors }}
      </label>
    {% endfor %}
    <div style="margin-top: 0.5rem;">
      <button class="btn" type="submit" style="width: 100%;">Save changes</button>
    </div>
  </form>
</section>
{% endblock %}
