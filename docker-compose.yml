services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - resumelens_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-this-in-compose}
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      DB_ENGINE: postgres
      DB_NAME: ai_project
      DB_USER: postgres
      DB_PASSWORD: root
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - resumelens_media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  resumelens_pg:
  resumelens_media:
